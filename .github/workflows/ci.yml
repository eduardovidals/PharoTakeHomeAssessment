name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          check-latest: false
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check startup, port conflicts and shutdown
        run: node --test scripts/dev.test.mjs

  validate:
    name: Validate (${{ matrix.package-manager }})
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          check-latest: false
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.12.1 --ignore-scripts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
          cache: false

      - name: Install pnpm
        if: matrix.package-manager == 'pnpm'
        run: npm install --global pnpm@10.33.0 --ignore-scripts

      - name: Switch to pnpm workspaces
        if: matrix.package-manager == 'pnpm'
        run: node scripts/workspace-protocol.mjs pnpm

      - name: Install npm dependencies
        if: matrix.package-manager == 'npm'
        run: npm ci

      - name: Install pnpm dependencies
        if: matrix.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: node scripts/playwright.mjs install --with-deps chromium

      - name: Validate application and packages with npm
        if: matrix.package-manager == 'npm'
        run: npm run validate

      - name: Validate application and packages with pnpm
        if: matrix.package-manager == 'pnpm'
        run: pnpm run validate

      - name: Preserve failed test diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-${{ matrix.package-manager }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/pharo-dashboard-api/tests/PharoDashboard.Api.Tests/TestResults/*.trx
            apps/pharo-dashboard-ui/playwright-report/
            apps/pharo-dashboard-ui/test-results/
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
